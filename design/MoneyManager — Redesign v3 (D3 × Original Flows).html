<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoneyManager — Redesign v3 (D3 Ring &amp; Clarity)</title>
  <!--
    ============================================================================
    DESIGN SYSTEM DECLARATION — MoneyManager Redesign v3
    Refinements applied per user review:
      1. Navigation: 3-tab bottom bar (支出 / 圖表 / 分析); 編輯種類 lives at 支出 > 新增支出 > 編輯種類
      2. GroupEdit (目前種類): True drag-and-drop reordering in the top grid
      3. GroupEdit (圖示庫): Clicking any icon opens a Name Input Dialog before adding
      4. CreateExpense (Item selection): Outline ring applied ONLY to the icon wrap, not the text
      5. CreateExpense (Group chip selection): Selected chip changes ONLY its border color (no solid dark fill)
    ============================================================================
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #E8ECF2;
      color: #111827;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 28px;
      gap: 14px;
    }

    /* ── Outer Quick-Jump Bar ─────────────────────────────────────────────── */
    .proto-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 820px;
    }
    .proto-pill {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      padding: 4px;
      border-radius: 12px;
    }
    .proto-pill button {
      border: none;
      background: transparent;
      color: #4B5563;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 140ms ease;
    }
    .proto-pill button.active { background: #111827; color: #FFFFFF; }
    .proto-hint { font-size: 12px; color: #5B6472; text-align: center; }

    /* ── Device Frame (390×824) ───────────────────────────────────────────── */
    .phone {
      width: 390px;
      height: 824px;
      border-radius: 44px;
      border: 8px solid #181A20;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 64px rgba(15, 23, 42, 0.18), 0 4px 12px rgba(15, 23, 42, 0.08);
      font-variant-numeric: tabular-nums;
      user-select: none;

      /* D3 Light Mode */
      --bg: #F3F5F8;
      --surface: #FFFFFF;
      --surface-alt: #EDF0F5;
      --ink: #111827;
      --muted: #6B7280;
      --line: #E8ECF2;
      --card-border: 1px solid rgba(15, 23, 42, 0.05);
      --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      --fab-bg: #111827;
      --fab-fg: #FFFFFF;
      --radius-card: 20px;

      /* Pastel Numpad (User Reference) */
      --sheet-bg: #F7F5F2;
      --key-num-bg: #FFFFFF;
      --key-num-fg: #1F2329;
      --key-del-bg: #FDDADF;
      --key-del-fg: #2A1B1E;
      --key-date-bg: #E3ECFF;
      --key-date-fg: #1E293B;
      --key-done-bg: #DCFCE1;
      --key-done-fg: #16301D;

      background: var(--bg);
      color: var(--ink);
      transition: background-color 200ms ease, color 200ms ease;
    }

    .phone[data-theme="dark"] {
      --bg: #111317;
      --surface: #1A1D24;
      --surface-alt: #242934;
      --ink: #F3F4F6;
      --muted: #9CA3AF;
      --line: #282D3A;
      --card-border: 1px solid rgba(255, 255, 255, 0.06);
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      --fab-bg: #F3F4F6;
      --fab-fg: #111317;

      --sheet-bg: #1B1D24;
      --key-num-bg: #262A34;
      --key-num-fg: #F3F4F6;
      --key-del-bg: #4B272E;
      --key-del-fg: #FFD6DD;
      --key-date-bg: #243452;
      --key-date-fg: #D8E6FF;
      --key-done-bg: #21422C;
      --key-done-fg: #D1FAD8;
    }

    .status-bar {
      height: 44px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .island { width: 94px; height: 24px; background: #0B0C0E; border-radius: 999px; }

    .app-viewport { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .scroll-area { flex: 1; overflow-y: auto; padding-bottom: 92px; scrollbar-width: none; }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* ── Header & Month Pill ──────────────────────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px 10px;
      min-height: 48px;
    }
    .top-bar-left { display: flex; align-items: center; gap: 6px; }
    .top-bar-right { display: flex; align-items: center; gap: 2px; }
    .top-bar h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-alt); }

    .month-row { display: flex; justify-content: center; padding: 4px 16px 14px; }
    .month-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      padding: 4px 6px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .month-pill button {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
    }
    .month-pill button:hover { background: var(--surface-alt); color: var(--ink); }
    .month-pill span { padding: 0 8px; }

    /* ── D3 Ring Hero & Daily Cards ───────────────────────────────────────── */
    .hero-card {
      margin: 0 16px 16px;
      background: var(--surface);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: var(--radius-card);
      padding: 20px;
      cursor: pointer;
    }
    .ring-hero { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .hero-kicker { font-size: 12px; font-weight: 600; color: var(--muted); }
    .hero-amt { font-size: 33px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin: 4px 0 6px; }
    .hero-sub { font-size: 12px; color: var(--muted); }
    .hero-sub strong { color: var(--ink); font-weight: 700; }

    .ring-wrap { width: 78px; height: 78px; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .ring-wrap svg { width: 78px; height: 78px; transform: rotate(-90deg); }
    .ring-center { position: absolute; font-size: 14px; font-weight: 800; }

    .day-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .day-card {
      background: var(--surface);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: var(--radius-card);
      padding: 14px 16px 6px;
    }
    .day-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 600; color: var(--muted);
      padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .day-head .sum { color: var(--ink); font-weight: 700; font-size: 13px; }

    .exp-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 2px; cursor: pointer; border-radius: 10px;
    }
    .exp-row:hover { background: var(--surface-alt); margin: 0 -6px; padding: 11px 8px; }
    .exp-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .exp-name { font-size: 14px; font-weight: 600; }
    .exp-note-hint { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    .exp-amt { font-size: 14.5px; font-weight: 700; }

    .pastel-badge {
      width: 36px; height: 36px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #181A20; flex-shrink: 0;
    }

    /* ── FAB & 3-Tab Bottom Navigation (支出 / 圖表 / 分析) ──────────────── */
    .fab-btn {
      position: absolute; right: 20px; bottom: 84px;
      width: 56px; height: 56px; border-radius: 19px;
      background: var(--fab-bg); color: var(--fab-fg); border: none;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.22); cursor: pointer; z-index: 10;
    }
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
      background: var(--surface); border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(3, 1fr);
      align-items: center; padding: 0 16px 10px; z-index: 9;
    }
    .nav-btn {
      border: none; background: transparent; color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-family: inherit; font-size: 11px; font-weight: 600;
      min-height: 46px; opacity: 0.42; cursor: pointer;
    }
    .nav-btn.active { opacity: 1; }

    /* ── CreateExpense: Border-Only Chip Selection & Icon-Only Selection ─── */
    .chip-row {
      display: flex; gap: 8px; padding: 4px 16px 14px;
      overflow-x: auto; scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 7px 14px; border-radius: 12px;
      display: inline-flex; align-items: center; gap: 7px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: border-color 150ms ease, color 150ms ease;
    }
    /* Selected chip: ONLY border color changes (plus primary text), no dark fill */
    .chip.active {
      background: var(--surface);
      color: var(--ink);
      border-width: 1.8px;
      border-color: var(--chip-active-border, var(--ink));
      font-weight: 700;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 4px 14px 16px;
    }
    .cat-tile {
      border: none; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 12px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center;
      gap: 7px; padding: 8px 4px; border-radius: 14px; cursor: pointer;
    }
    .cat-tile.selected {
      color: var(--ink);
      font-weight: 700;
    }
    .tile-ico-wrap {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink);
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 120ms ease;
    }
    .tile-ico-wrap svg.ico { width: 26px; height: 26px; stroke-width: 1.8; }
    /* Selected icon: ONLY the icon wrapper gets the crisp selection frame! */
    .cat-tile.selected .tile-ico-wrap {
      border: 2px solid var(--sel-color, var(--ink));
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    /* ── Pastel Numpad BottomSheet ────────────────────────────────────────── */
    .numpad-sheet {
      background: var(--sheet-bg);
      border-radius: 28px 28px 0 0;
      padding: 10px 16px 20px;
      box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.08);
      flex-shrink: 0;
    }
    .sheet-handle {
      width: 36px; height: 4px; border-radius: 999px;
      background: var(--ink); opacity: 0.6; margin: 0 auto 12px;
    }
    .numpad-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4px 14px;
    }
    /* Option 1: Pure white pill matching digit keys + generous pastel icon chip */
    .numpad-pill {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--key-num-bg);
      padding: 4px 16px 4px 4px;
      border-radius: 999px;
      font-size: 15.5px; font-weight: 700;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .numpad-pill-ico {
      width: 38px; height: 38px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink); flex-shrink: 0;
    }
    .numpad-pill-ico svg.ico { width: 24px; height: 24px; stroke-width: 1.9; }
    .numpad-amount {
      display: inline-flex; align-items: baseline; gap: 3px;
      font-size: 28px; font-weight: 800; letter-spacing: -0.03em;
      color: var(--ink);
      padding-right: 4px;
    }
    .numpad-amount .cur {
      font-size: 18px; font-weight: 600; color: var(--muted);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 56px);
      gap: 9px;
    }
    .nk {
      border: none; border-radius: 20px;
      background: var(--key-num-bg); color: var(--key-num-fg);
      font-family: inherit; font-size: 19px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; cursor: pointer;
      transition: transform 80ms ease;
    }
    .nk:active { transform: scale(0.95); }
    .nk.del { background: var(--key-del-bg); color: var(--key-del-fg); }
    .nk.date {
      background: var(--key-date-bg); color: var(--key-date-fg);
      grid-column: 4; grid-row: 2 / span 2; font-size: 12.5px; font-weight: 700;
    }
    .nk.done { background: var(--key-done-bg); color: var(--key-done-fg); }

    /* ── Detail (詳細) 2-Card Layout ──────────────────────────────────────── */
    .card-box {
      margin: 0 16px 14px;
      background: var(--surface);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: var(--radius-card);
      padding: 18px;
    }
    .detail-meta-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; font-size: 14.5px; font-weight: 600;
    }
    .note-textarea {
      width: 100%; min-height: 110px; border: none; background: transparent;
      color: var(--ink); font-family: inherit; font-size: 14.5px;
      line-height: 1.6; resize: none; outline: none; padding: 6px 0;
    }

    /* ── GroupList (編輯種類 — under 支出 > 新增支出) ─────────────────────── */
    .group-list-card {
      margin: 0 16px;
      background: var(--surface);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .group-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 12px; border-bottom: 1px solid var(--line);
    }
    .group-row:last-child { border-bottom: none; }
    .group-row.is-hidden { opacity: 0.42; }
    .group-row-main { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }

    /* ── GroupEdit 2-Pane Layout (Draggable Top Grid + Name-Input Tray) ───── */
    .edit-pane {
      margin: 0 16px 12px;
      background: var(--surface);
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: var(--radius-card);
      padding: 14px 10px;
    }
    .edit-pane-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      padding: 0 8px 10px; display: flex; justify-content: space-between;
    }
    .edit-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      max-height: 260px; overflow-y: auto; scrollbar-width: none;
    }
    .edit-grid::-webkit-scrollbar { display: none; }
    .edit-icon-cell {
      position: relative; display: flex; flex-direction: column;
      align-items: center; gap: 5px; padding: 10px 4px;
      border-radius: 14px; background: var(--bg); font-size: 11.5px; font-weight: 500;
      cursor: grab; border: 1.5px solid transparent;
      transition: border-color 120ms ease, opacity 120ms ease, transform 120ms ease;
    }
    .edit-icon-cell:active { cursor: grabbing; }
    .edit-icon-cell.dragging { opacity: 0.35; transform: scale(0.95); }
    .edit-icon-cell.drag-over { border-color: var(--ink); background: var(--surface-alt); }

    .remove-x {
      position: absolute; top: 3px; right: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      border: none; background: var(--surface-alt); color: var(--muted);
      font-size: 11px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .remove-x:hover { background: #EF4444; color: #FFFFFF; }
    .tray-btn {
      border: none; background: var(--bg); color: var(--ink);
      height: 50px; border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 120ms ease;
    }
    .tray-btn:hover { background: var(--surface-alt); }

    /* ── Chart & Analytics ────────────────────────────────────────────────── */
    .donut-wrap {
      position: relative; width: 176px; height: 176px; margin: 6px auto 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .donut-wrap svg { width: 176px; height: 176px; transform: rotate(-90deg); }
    .donut-center { position: absolute; text-align: center; }
    .donut-center small { display: block; font-size: 11px; color: var(--muted); }
    .donut-center strong { font-size: 22px; font-weight: 800; }

    .range-pills { display: flex; align-items: center; gap: 6px; padding: 0 18px 14px; }
    .range-pills button {
      border: none; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 12.5px; font-weight: 700;
      min-width: 40px; height: 36px; padding: 0 10px;
      border-radius: 999px; cursor: pointer;
    }
    .range-pills button.active { background: var(--ink); color: var(--bg); }

    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--line);
      font-size: 14px; font-weight: 600;
    }
    .setting-row:last-child { border-bottom: none; }

    /* ── Modals ───────────────────────────────────────────────────────────── */
    .modal-backdrop {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(4px); display: flex; align-items: center;
      justify-content: center; padding: 24px; z-index: 30;
    }
    .modal-card {
      width: 100%; background: var(--surface); border-radius: 26px;
      padding: 22px; box-shadow: 0 20px 44px rgba(0, 0, 0, 0.25);
    }
    .text-input {
      width: 100%; height: 44px; border: 1px solid var(--line);
      border-radius: 13px; background: var(--bg); color: var(--ink);
      font-family: inherit; font-size: 15px; font-weight: 600;
      padding: 0 14px; outline: none;
    }
    .text-input:focus { border-color: var(--ink); }
    .money-input-wrap {
      display: flex; align-items: center; gap: 8px;
      height: 48px; border: 1.5px solid var(--line); border-radius: 14px;
      background: var(--bg); padding: 0 14px;
    }
    .money-input-wrap:focus-within { border-color: var(--ink); }
    .money-input-wrap .prefix { font-size: 16px; font-weight: 700; color: var(--muted); }
    .money-input-wrap input {
      width: 100%; border: none; background: transparent; color: var(--ink);
      font-family: inherit; font-size: 20px; font-weight: 800; outline: none;
      letter-spacing: -0.02em;
    }
    .warn-preview-bar {
      display: flex; height: 8px; border-radius: 999px; overflow: hidden;
      gap: 2px; margin: 14px 0 12px; background: var(--surface-alt);
    }
    .warn-row {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;
    }
    .warn-row-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12.5px; font-weight: 600;
    }
    .warn-row-head .label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .warn-row-head .val { font-weight: 700; color: var(--ink); }
    .warn-slider {
      width: 100%; height: 5px; border-radius: 999px; appearance: none;
      background: var(--surface-alt); outline: none; cursor: pointer;
    }
    .warn-slider.mid::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: #F59E0B; border: 2px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .warn-slider.high::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: #EF4444; border: 2px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .color-wheel {
      width: 172px; height: 172px; border-radius: 50%; margin: 18px auto 14px;
      background: radial-gradient(circle, #FFFFFF 12%, transparent 62%),
        conic-gradient(#FF4D4D, #FFB84D, #F5E663, #6EE787, #5CE1E6, #5C85FF, #B86BFF, #FF5CA8, #FF4D4D);
      position: relative; cursor: crosshair;

    .toast {
      position: absolute; top: 54px; left: 50%; transform: translateX(-50%);

      padding: 8px 16px; border-radius: 999px; z-index: 40;
      pointer-events: none; opacity: 0; transition: opacity 180ms ease; white-space: nowrap;

    .toast.show { opacity: 1; }

    svg.ico {
      width: 19px; height: 19px; stroke: currentColor; fill: none;
      stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .pastel-badge svg.ico, .edit-icon-cell svg.ico, .tray-btn svg.ico { width: 22px; height: 22px; }

      const total = state.expenses.reduce((s, e) => s + e.amount, 0);
      const pct = Math.min(100, Math.round((total / state.budgetLimit) * 100));
      const remain = Math.max(0, state.budgetLimit - total);

      const r = 31, circ = 2 * Math.PI * r, dash = (pct / 100) * circ;

      const byDate = {};
      state.expenses.forEach(e => {

    function renderChart() {
      const total = state.expenses.reduce((s, e) => s + e.amount, 0) || 1;
      const sums = {};
      state.expenses.forEach(e => { sums[e.groupId] = (sums[e.groupId] || 0) + e.amount; });
      const rows = state.groups.map(g => ({ group: g, amt: sums[g.id] || 0 })).filter(x => x.amt > 0).sort((a, b) => b.amt - a.amt);

      const r = 64, circ = 2 * Math.PI * r;
      let offset = 0;
      const segs = rows.map(x => {
        const len = (x.amt / total) * circ;
        const seg = `<circle cx="88" cy="88" r="${r}" fill="none" stroke="${x.group.color}" stroke-width="22"
          stroke-dasharray="${Math.max(2, len - 2.5).toFixed(1)} ${circ.toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}"
          style="cursor:pointer" onclick="openChartDetail('${x.group.id}')" />`;
        offset += len;
        return seg;
      }).join('');

      return `
        <div class="scroll-area">
          <div class="month-row">
            <div class="month-pill">
              <button onclick="shiftMonth(-1)">‹</button>
              <span>${getMonthLabel()}</span>
              <button onclick="shiftMonth(1)">›</button>
            </div>
          </div>
          <div class="card-box" style="text-align:center;">
            <div class="donut-wrap">
              <svg viewBox="0 0 176 176">${segs}</svg>
              <div class="donut-center"><small>本月總花費</small><strong>${fmt(total)}</strong></div>
            </div>
          </div>
          <div class="card-box" style="padding:6px 16px;">
            ${rows.map(x => `
              <div class="setting-row" style="cursor:pointer" onclick="openChartDetail('${x.group.id}')">
                <div style="display:flex;align-items:center;gap:10px;">
                  <span class="dot" style="width:12px;height:12px;background:${x.group.color}"></span>
                  <span>${x.group.name}</span>
                </div>
                <div><strong>${fmt(x.amt)}</strong><span style="font-size:12px;color:var(--muted);margin-left:8px;">${Math.round((x.amt / total) * 100)}% ›</span></div>
              </div>
            `).join('')}
          </div>
        </div>
        ${renderBottomNav('chart')}
      `;
    }

    function renderAnalytics() {
      const r = state.analyticsRange;
      const d = TREND_DATA[r];
      const maxV = Math.ceil(Math.max(...d.vals) / 1000) * 1000 || 1000;
      const totalV = d.vals.reduce((a, b) => a + b, 0);
      const w = 310, h = 180, padL = 42, padR = 14, padT = 14, padB = 26;

      const yTicks = [0, 0.33, 0.66, 1].map(f => ({
        val: Math.round((maxV * f) / 100) * 100,
        y: h - padB - f * (h - padT - padB)
      }));

      const pts = d.vals.map((v, i) => ({
        x: padL + (i / Math.max(1, d.vals.length - 1)) * (w - padL - padR),
        y: h - padB - (v / maxV) * (h - padT - padB),
        label: d.labels[i]
      }));

      let path = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {
        const cx = ((pts[i - 1].x + pts[i].x) / 2).toFixed(1);
        path += ` C ${cx} ${pts[i - 1].y.toFixed(1)}, ${cx} ${pts[i].y.toFixed(1)}, ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`;
      }
      const area = `${path} L ${pts[pts.length - 1].x.toFixed(1)} ${h - padB} L ${pts[0].x.toFixed(1)} ${h - padB} Z`;

      return `
        <div class="top-bar">
          <div class="top-bar-left"><h2 style="padding-left:6px;">趨勢分析</h2></div>
          <div class="top-bar-right">
            <button class="icon-btn" onclick="toggleTheme()" title="切換亮暗色主題">${state.theme === 'dark' ? ICONS.sun : ICONS.moon}</button>
            <button class="icon-btn" onclick="openModal('backup')" title="本地備份 / Google Drive">${ICONS.backup}</button>
          </div>
        </div>

        <div class="range-pills">
          ${['7D','1M','3M','6M','1Y','All'].map(k => `<button class="${r === k ? 'active' : ''}" onclick="setRange('${k}')">${k}</button>`).join('')}
        </div>

        <div class="scroll-area">
          <div class="card-box">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
              <div>
                <div style="font-size:12px;color:var(--muted);font-weight:600;">支出（${r}）</div>
                <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;">${fmt(totalV)}</div>
              </div>
              <div style="font-size:12px;color:var(--muted);">日均 ${fmt(Math.round(totalV / d.vals.length))}</div>
            </div>

            <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible;">
              ${yTicks.map(t => `
                <line x1="${padL}" y1="${t.y.toFixed(1)}" x2="${w - padR}" y2="${t.y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3" />
                <text x="${padL - 8}" y="${(t.y + 3).toFixed(1)}" text-anchor="end" fill="var(--muted)" font-size="10">$${t.val >= 1000 ? (t.val / 1000).toFixed(1).replace('.0','') + 'k' : t.val}</text>
              `).join('')}
              <path d="${area}" fill="#10B981" fill-opacity="0.11" />
              <path d="${path}" fill="none" stroke="#10B981" stroke-width="2.6" stroke-linecap="round" />
              ${pts.map(p => `
                <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.8" fill="var(--surface)" stroke="#10B981" stroke-width="2.2" />
                <text x="${p.x.toFixed(1)}" y="${h - 6}" text-anchor="middle" fill="var(--muted)" font-size="10">${p.label}</text>
              `).join('')}
            </svg>
          </div>
        </div>
        ${renderBottomNav('analytics')}
      `;
    }

    function renderModal() {

        const mid = state.warnMid;

              <div class="money-input-wrap">

                <input id="budgetInput" type="text" inputmode="numeric" value="${lim}" oninput="updateBudgetPreview()" placeholder="輸入每月預算" />

                <div id="barLow" style="width:${mid}%;background:#10B981;transition:width 120ms ease;"></div>
                <div id="barMid" style="width:${high - mid}%;background:#F59E0B;transition:width 120ms ease;"></div>
                <div id="barHigh" style="width:${100 - high}%;background:#EF4444;transition:width 120ms ease;"></div>
              </div>

              <div class="warn-row">
                <div class="warn-row-head">
                  <span class="label"><span class="dot" style="background:#F59E0B"></span>注意警戒（黃色）</span>
                  <span class="val" id="midValLabel">${mid}% · ${fmt(Math.round(lim * mid / 100))}</span>
                </div>
                <input class="warn-slider mid" id="warnMidInput" type="range" min="10" max="85" step="5" value="${mid}" oninput="updateBudgetPreview('mid')" />
              </div>

              <div class="warn-row" style="margin-bottom:16px;">
                <div class="warn-row-head">
                  <span class="label"><span class="dot" style="background:#EF4444"></span>超支警戒（紅色）</span>
                  <span class="val" id="highValLabel">${high}% · ${fmt(Math.round(lim * high / 100))}</span>
                </div>
                <input class="warn-slider high" id="warnHighInput" type="range" min="20" max="95" step="5" value="${high}" oninput="updateBudgetPreview('high')" />

              <div style="display:flex;gap:8px;">
                <button class="secondary-btn" onclick="closeModal()">取消</button>
                <button class="primary-btn" onclick="saveBudget()">儲存</button>
              </div>
            </div>
          </div>
        `;
      }
      if (state.modal === 'nameIcon' && state.pendingTrayIcon) {
        const g = getGroup(state.editingGroupId);
        return `
          <div class="modal-backdrop" onclick="closeModal()">
            <div class="modal-card" onclick="event.stopPropagation()">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
                <span class="pastel-badge" style="width:42px;height:42px;background:${g.color}">${ICONS[state.pendingTrayIcon.icon]}</span>
                <div>
                  <div style="font-size:15px;font-weight:700;">輸入種類名稱</div>
                  <div style="font-size:12px;color:var(--muted);">加入至「${g.name}」群組</div>
                </div>
              </div>
              <input class="text-input" id="newIconNameInput" placeholder="例如：${state.pendingTrayIcon.hint}" value="" />
              <div style="display:flex;gap:8px;margin-top:14px;">
                <button class="secondary-btn" onclick="closeModal()">取消</button>
                <button class="primary-btn" onclick="confirmAddIcon()">確認加入</button>
              </div>
            </div>
          </div>
        `;
      }
      if (state.modal === 'addGroup' || state.modal === 'groupColor') {
        const isEdit = state.modal === 'groupColor';
        const g = isEdit ? getGroup(state.editingGroupId) : null;
        const curColor = isEdit ? g.color : state.modalColor;
        return `
          <div class="modal-backdrop" onclick="closeModal()">
            <div class="modal-card" onclick="event.stopPropagation()">
              <div style="display:flex;gap:8px;align-items:center;">
                <input class="text-input" id="modalGroupName" placeholder="例: 生活" value="${isEdit ? g.name : ''}" />
                <button class="icon-btn" style="background:var(--fab-bg);color:var(--fab-fg);border-radius:13px;" onclick="${isEdit ? `saveGroupMeta('${g.id}')` : 'createGroup()'}">${ICONS.check}</button>
              </div>
              <div class="color-wheel" onclick="pickWheelColor(event)" title="點擊色輪選色"></div>
              <div class="wheel-presets">
                ${MACARON_PRESETS.map(c => `<button class="swatch ${curColor === c ? 'active' : ''}" style="background:${c}" onclick="setModalColor('${c}')"></button>`).join('')}
              </div>
              <button class="secondary-btn" onclick="closeModal()">關閉</button>
            </div>
          </div>
        `;
      }
      if (state.modal === 'backup') {
        return `
          <div class="modal-backdrop" onclick="closeModal()">
            <div class="modal-card" onclick="event.stopPropagation()">
              <h3 style="margin:0 0 12px;">資料備份與還原</h3>
              <div style="display:flex;flex-direction:column;gap:10px;">
                <button class="primary-btn" onclick="closeModal();showToast('已匯出離線 JSON 備份檔')">匯出本地備份 (JSON)</button>
                <button class="secondary-btn" onclick="closeModal();showToast('已模擬匯入本地備份')">從本地匯入還原</button>
                <button class="secondary-btn" disabled style="opacity:0.55;cursor:default;">Google Drive 雲端備份（即將推出）</button>
              </div>
            </div>
          </div>
        `;
      }
      return '';
    }

    function render() {
      const app = document.getElementById('app');
      let html = '';
      if (state.screen === 'home') html = renderHome();
      else if (state.screen === 'create') html = renderCreate();
      else if (state.screen === 'note') html = renderNote();
      else if (state.screen === 'groups') html = renderGroups();
      else if (state.screen === 'groupEdit') html = renderGroupEdit();
      else if (state.screen === 'chart') html = renderChart();
      else if (state.screen === 'chartDetail') html = renderChartDetail();
      else if (state.screen === 'analytics') html = renderAnalytics();
      app.innerHTML = html + renderModal();
      syncOuter();
      if (state.modal === 'nameIcon') {
        const inp = document.getElementById('newIconNameInput');
        if (inp) setTimeout(() => inp.focus(), 30);
      }
    }

    /* ── Drag-and-Drop Reorder Handlers for GroupEdit ─────────────────────── */
    window.onDragStart = (ev, idx) => {
      state.dragFromIdx = idx;
      ev.currentTarget.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'move';
    };
    window.onDragOver = (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; };
    window.onDragEnter = (ev) => { ev.currentTarget.classList.add('drag-over'); };
    window.onDragLeave = (ev) => { ev.currentTarget.classList.remove('drag-over'); };
    window.onDropItem = (ev, gid, toIdx) => {
      ev.preventDefault();
      const fromIdx = state.dragFromIdx;
      if (fromIdx === null || fromIdx === toIdx) return;
      const g = getGroup(gid);
      const [moved] = g.items.splice(fromIdx, 1);
      g.items.splice(toIdx, 0, moved);
      state.dragFromIdx = null;
      showToast(`已調整「${moved.name}」順序`);
      render();
    };
    window.onDragEnd = (ev) => {
      ev.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.edit-icon-cell').forEach(el => el.classList.remove('drag-over'));
      state.dragFromIdx = null;
    };

    /* ── App Actions ──────────────────────────────────────────────────────── */
    window.go = (s) => { state.screen = s; state.modal = null; render(); };
    window.shiftMonth = (d) => { state.monthOffset = Math.max(-1, Math.min(1, state.monthOffset + d)); render(); };
    window.toggleTheme = () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; render(); };
    window.openModal = (m) => { state.modal = m; render(); };
    window.closeModal = () => { state.modal = null; state.pendingTrayIcon = null; render(); };
    window.updateBudgetPreview = (changed) => {
      const inp = document.getElementById('budgetInput');
      const midEl = document.getElementById('warnMidInput');
      const highEl = document.getElementById('warnHighInput');
      if (!inp || !midEl || !highEl) return;
      const rawLim = parseInt(inp.value.replace(/[^\d]/g, ''), 10) || 0;
      let mid = parseInt(midEl.value, 10);
      let high = parseInt(highEl.value, 10);
      if (changed === 'mid' && mid >= high) { high = Math.min(95, mid + 5); highEl.value = high; }
      if (changed === 'high' && high <= mid) { mid = Math.max(10, high - 5); midEl.value = mid; }
      document.getElementById('barLow').style.width = `${mid}%`;
      document.getElementById('barMid').style.width = `${high - mid}%`;
      document.getElementById('barHigh').style.width = `${100 - high}%`;
      document.getElementById('midValLabel').textContent = `${mid}% · ${fmt(Math.round(rawLim * mid / 100))}`;
      document.getElementById('highValLabel').textContent = `${high}% · ${fmt(Math.round(rawLim * high / 100))}`;
    };
    window.saveBudget = () => {
      const v = parseInt(document.getElementById('budgetInput').value.replace(/[^\d]/g, ''), 10);
      const mid = parseInt(document.getElementById('warnMidInput').value, 10);
      const high = parseInt(document.getElementById('warnHighInput').value, 10);
      if (v > 0) {
        state.budgetLimit = v;
        state.warnMid = mid;
        state.warnHigh = high;
        showToast(`上限 ${fmt(v)}（黃 ${mid}% / 紅 ${high}%）`);
      }
      state.modal = null; render();
    };
    window.openCreate = () => {
      state.draft = { editId: null, tab: 'food', groupId: 'food', itemId: 'meal', amountStr: '0', dateIndex: 0 };
      state.screen = 'create'; render();
    };
    window.setDraftTab = (tab) => {
      state.draft.tab = tab;
      if (tab !== 'recent') {
        const g = getGroup(tab);
        state.draft.groupId = g.id;
        state.draft.itemId = g.items[0]?.id || '';
      }
      render();
    };
    window.selectDraftItem = (gid, iid) => { state.draft.groupId = gid; state.draft.itemId = iid; render(); };
    window.pressKey = (k) => {
      let s = state.draft.amountStr;
      if (k === 'del') s = s.length > 1 ? s.slice(0, -1) : '0';
      else if (s === '0') s = (k === '00' || k === '000') ? '0' : k;
      else if (s.length < 7) s += k;
      state.draft.amountStr = s; render();
    };
    window.cycleDate = () => { state.draft.dateIndex = (state.draft.dateIndex + 1) % DATE_OPTIONS.length; render(); };
    window.commitExpense = () => {
      const amt = parseInt(state.draft.amountStr, 10);
      if (!amt) { showToast('請先輸入金額'); return; }
      const g = getGroup(state.draft.groupId);
      const it = g.items.find(i => i.id === state.draft.itemId) || g.items[0];
      const dOpt = DATE_OPTIONS[state.draft.dateIndex];
      if (state.draft.editId) {
        const t = state.expenses.find(e => e.id === state.draft.editId);
        if (t) { Object.assign(t, { groupId: g.id, itemId: it.id, name: it.name, icon: it.icon, amount: amt, date: dOpt.date, weekday: dOpt.weekday }); }
        state.selectedExpenseId = state.draft.editId; state.screen = 'note'; showToast('已更新支出');
      } else {
        state.expenses.unshift({ id: Date.now(), month: '2026-11', date: dOpt.date, weekday: dOpt.weekday, time: '11:17:00', groupId: g.id, itemId: it.id, name: it.name, icon: it.icon, amount: amt, note: '' });
        state.screen = 'home'; showToast(`已新增 ${it.name} ${fmt(amt)}`);
      }
      render();
    };
    window.openNote = (id) => { state.selectedExpenseId = id; state.screen = 'note'; render(); };
    window.openEditFromNote = (id) => {
      const e = state.expenses.find(x => x.id === id);
      if (!e) return;
      state.draft = { editId: e.id, tab: e.groupId, groupId: e.groupId, itemId: e.itemId, amountStr: String(e.amount), dateIndex: 0 };
      state.screen = 'create'; render();
    };
    window.saveNote = (id) => {
      const e = state.expenses.find(x => x.id === id);
      if (e) e.note = document.getElementById('noteInput').value.trim();
      showToast('備註已儲存'); render();
    };
    window.deleteExpense = (id) => {
      state.expenses = state.expenses.filter(e => e.id !== id);
      state.screen = 'home'; showToast('已刪除該筆支出'); render();
    };
    window.moveGroupUp = (idx) => {
      if (idx <= 0) return;
      [state.groups[idx - 1], state.groups[idx]] = [state.groups[idx], state.groups[idx - 1]]; render();
    };
    window.toggleGroupHidden = (gid) => { const g = getGroup(gid); g.hidden = !g.hidden; render(); };
    window.openGroupEdit = (gid) => { state.editingGroupId = gid; state.screen = 'groupEdit'; render(); };
    window.removeGroupItem = (gid, iid) => {
      const g = getGroup(gid);
      if (g.items.length <= 1) { showToast('群組至少保留一個種類'); return; }
      g.items = g.items.filter(i => i.id !== iid); render();
    };
    window.promptIconName = (icon, hint) => {
      state.pendingTrayIcon = { icon, hint };
      state.modal = 'nameIcon';
      render();
    };
    window.confirmAddIcon = () => {
      if (!state.pendingTrayIcon) return;
      const g = getGroup(state.editingGroupId);
      const val = document.getElementById('newIconNameInput').value.trim() || state.pendingTrayIcon.hint;
      g.items.push({ id: 'i_' + Date.now(), name: val, icon: state.pendingTrayIcon.icon });
      state.modal = null;
      state.pendingTrayIcon = null;
      showToast(`已新增「${val}」`);
      render();
    };
    window.setModalColor = (c) => {
      if (state.modal === 'groupColor') getGroup(state.editingGroupId).color = c;
      else state.modalColor = c;
      render();
    };
    window.pickWheelColor = (ev) => {
      const rect = ev.currentTarget.getBoundingClientRect();
      const angle = (Math.atan2(ev.clientY - (rect.top + rect.height / 2), ev.clientX - (rect.left + rect.width / 2)) * 180 / Math.PI + 450) % 360;
      setModalColor(`hsl(${Math.round(angle)}, 68%, 78%)`);
    };
    window.saveGroupMeta = (gid) => {
      const g = getGroup(gid);
      const val = document.getElementById('modalGroupName').value.trim();
      if (val) g.name = val;
      state.modal = null; showToast('群組已更新'); render();
    };
    window.createGroup = () => {
      const name = document.getElementById('modalGroupName').value.trim() || '新群組';
      const id = 'g_' + Date.now();
      state.groups.push({ id, name, color: state.modalColor, hidden: false, items: [{ id: 'i_' + Date.now(), name: '一般', icon: 'bag' }] });
      state.modal = null; state.editingGroupId = id; state.screen = 'groupEdit'; render();
    };
    window.openChartDetail = (gid) => { state.chartDetailGroupId = gid; state.screen = 'chartDetail'; render(); };
    window.setRange = (r) => { state.analyticsRange = r; render(); };

    document.querySelectorAll('#quickNav button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.go === 'create') openCreate();
        else go(btn.dataset.go);
      });
    });
    document.getElementById('toggleThemeOuter').addEventListener('click', toggleTheme);
    render();
  </script>
</body>
</html>
